<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disclander Sound Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: a tracker's front panel. Mood row, transport, the piano roll as the hero, knobs beneath. One committed dark look, like the game's night sky. */
:root {
  --bg: #12121c;
  --panel: #1b1b2a;
  --line: #2f2f45;
  --fg: #e8e2cf;
  --dim: #8f8aa6;
  --gold: #e3b54a;
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --v-square: #e3b54a; --v-thin: #f08a5d; --v-tri: #6fb7e8; --v-arp: #8f7fd6;
  --v-noise: #9aa0a6; --v-kick: #c95f6b; --v-bell: #8fe0c2; --v-pad: #c99ae8;
  --v-keys: #e3b54a; --v-warm: #7d6fb8; --v-sub: #6fb7e8; --v-glass: #8fe0c2; --v-flute: #f08a5d; --v-pluck: #e58fb4; --v-thump: #c95f6b;
  --v-saw: #f2c14e; --v-growl: #6fb7e8; --v-zap: #8fe0c2; --v-stab: #c99ae8; --v-boom: #c95f6b; --v-snap: #f08a5d; --v-tick: #9aa0a6;
  --v-bow: #d98a4e; --v-choir: #b7a4f0; --v-reed: #b8d45a; --v-mallet: #d9b38c; --v-doum: #c95f6b; --v-tek: #e8d9a0; --v-grit: #e2603a; --v-horn: #f0c040; --v-wail: #ff7a4a; --v-organ: #7fc8a9; --v-wah: #d9e04a;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; margin: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
h1 { font-family: var(--display); font-weight: 600; font-size: 2rem; color: var(--gold); margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
.sub { color: var(--dim); margin: 0; }
.label { font-family: var(--display); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.moods { display: flex; flex-wrap: wrap; gap: 8px; }
button, select, input { font: inherit; color: var(--fg); }
.mood, .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 8px 14px; cursor: pointer; font-family: var(--display); font-size: 1rem; }
.mood:hover, .btn:hover { border-color: var(--dim); }
.mood[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: #2a2516; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.play { background: var(--gold); color: #1a1408; border-color: var(--gold); min-width: 92px; }
.play:hover { border-color: var(--fg); }
.seed { display: flex; align-items: center; gap: 6px; font-family: var(--mono); }
.seed input { width: 5.5em; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 7px 8px; font-variant-numeric: tabular-nums; }
.status { font-family: var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; margin-left: auto; }
.check { display: flex; align-items: center; gap: 6px; color: var(--dim); }
.roll { background: #0c0c14; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.roll canvas { display: block; width: 100%; height: 100%; min-width: 0; }
/* The tracks: a row a channel, its name and instrument at the left, its notes beside them. */
.tracks { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr); height: 336px; }
.heads { display: grid; grid-template-rows: repeat(6, minmax(0, 1fr)); border-right: 1px solid var(--line); min-width: 0; }
.heads .head { display: grid; align-content: center; gap: 3px; padding: 0 8px; min-width: 0; border-top: 1px solid #1d1d2c; }
.heads .head:first-child { border-top: 0; }
.heads .head .label { font-size: 0.62rem; }
.heads .head.silent .label { color: var(--dim); text-decoration: line-through; }
.heads .head.changed .label { color: var(--gold); }
.heads select { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 3px 2px; width: 100%; min-width: 0; box-sizing: border-box; font-size: 0.8rem; text-overflow: ellipsis; }
@media (max-width: 560px) { .tracks { grid-template-columns: minmax(0, 104px) minmax(0, 1fr); } .heads .head { padding: 0 4px; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 0.8rem; color: var(--dim); }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
.layers { display: grid; gap: 12px; }
.layer { display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 16px 18px; }
.layer h3 { font-family: var(--display); font-weight: 400; font-size: 1.1rem; margin: 0; color: var(--gold); }
.knobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 24px; }
.knob { display: grid; gap: 6px; min-width: 0; }
.knob[hidden] { display: none; }
.knobs.inline { display: flex; }
.knobs.inline .knob { display: flex; align-items: center; gap: 8px; }
.knobs.inline select { background: var(--panel); padding: 7px 8px; }
.pages { display: flex; gap: 8px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.page[hidden], .group[hidden] { display: none; }
.page { display: grid; gap: 18px; }
.knob .top { display: flex; justify-content: space-between; gap: 8px; }
.knob output { font-family: var(--mono); color: var(--gold); font-variant-numeric: tabular-nums; }
.knob input[type=range] { width: 100%; accent-color: var(--gold); }
.knob select { background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.settings { flex: 1 1 320px; min-width: 0; display: grid; gap: 6px; }
.settings textarea { width: 100%; box-sizing: border-box; min-height: 5.5em; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; color: var(--fg); font-family: var(--mono); font-size: 0.85rem; padding: 10px; resize: vertical; }
h2 { font-family: var(--display); font-weight: 600; font-size: 1.4rem; margin: 0; color: var(--fg); }
.sechead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; border-top: 1px solid var(--line); padding-top: 18px; }
.vol, .master { display: flex; align-items: center; gap: 8px; }
.master { margin-left: auto; }
.vol input, .master input { width: 140px; accent-color: var(--gold); }
.sounds { display: grid; gap: 16px; align-items: start; }
.sounds .list { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px 12px; }
.group { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.group .head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.group h3 { font-family: var(--display); font-weight: 400; font-size: 1.1rem; margin: 0; color: var(--gold); }
.group .vol input { width: 100px; }
.list { display: grid; gap: 4px; }
.snd { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: baseline; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 3px; padding: 6px 8px; cursor: pointer; }
.snd:hover { border-color: var(--line); background: var(--bg); }
.snd .n { font-family: var(--display); font-size: 0.95rem; }
.snd .a { grid-column: 1 / -1; color: var(--dim); font-size: 0.82rem; line-height: 1.35; }
.snd .tag { font-family: var(--mono); font-size: 0.7rem; color: var(--dim); justify-self: end; }
.snd[aria-pressed="true"] { border-color: var(--gold); background: #2a2516; }
.snd[aria-pressed="true"] .n { color: var(--gold); }
.small { padding: 4px 10px; font-size: 0.85rem; }
.layer .head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.hint { color: var(--dim); font-size: 0.82rem; line-height: 1.4; margin: 0; }
/* The mixer: a channel strip a seat, upright, side by side, and the master. */
.mixer { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
.seat { box-sizing: border-box; flex: 1 0 112px; max-width: 190px; display: grid; gap: 8px; min-width: 0; align-content: start; justify-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 10px 8px; }
.seat.master { border-color: var(--dim); }
.seat select { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 6px 4px; width: 100%; min-width: 0; box-sizing: border-box; font-size: 0.85rem; text-overflow: ellipsis; }
.seat .who { width: 100%; height: 2.3rem; line-height: 1.15; overflow: hidden; display: grid; align-items: center; text-align: center; color: var(--dim); font-size: 0.85rem; }
.seat input[type=range] { writing-mode: vertical-lr; direction: rtl; width: 28px; height: 150px; accent-color: var(--gold); }
.seat input[type=range]:disabled { opacity: 0.35; }
.seat .top { display: grid; justify-items: center; gap: 2px; }
.seat output { font-family: var(--mono); color: var(--gold); font-variant-numeric: tabular-nums; min-height: 1.2em; }
.seat .ms { display: flex; gap: 4px; min-height: 30px; }
.seat .ms button { width: 28px; height: 30px; padding: 0; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; cursor: pointer; color: inherit; }
.seat .ms button svg, .seat .take button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.seat .ms button:disabled { opacity: 0.3; cursor: default; }
.seat .ms .gear.changed { color: var(--gold); border-color: var(--gold); }
.seat .ms button:hover { border-color: var(--dim); }
.seat .ms .mute[aria-pressed="true"] { background: #5a2a2a; border-color: #c95f6b; color: #ffd0d0; }
.seat .ms .solo[aria-pressed="true"] { background: #4a4216; border-color: var(--gold); color: var(--gold); }
.seat.silent .label, .seat.silent output { color: var(--dim); text-decoration: line-through; }
.seat .hint { text-align: center; }
.seat .take { display: grid; grid-template-columns: minmax(0, 1fr) 28px; gap: 2px 4px; width: 100%; min-height: 46px; align-content: start; font-size: 0.8rem; color: var(--dim); }
.seat .take label { grid-column: 1 / -1; text-align: center; }
.seat .take input { min-width: 0; width: 100%; box-sizing: border-box; height: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 4px; font-family: var(--mono); color: inherit; }
.seat .take button { width: 28px; height: 28px; padding: 0; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; cursor: pointer; color: inherit; }
.seat.fx { flex-basis: 156px; max-width: 230px; }
.seat .trio { display: flex; justify-content: space-around; gap: 4px; width: 100%; }
.seat .trio .col { display: grid; justify-items: center; gap: 8px; min-width: 0; }
.seat .trio .label { font-size: 0.6rem; letter-spacing: 0; }
.seat .trio output { font-size: 0.8rem; }
.seat .trio .col.changed .label { color: var(--gold); }
/* An instrument's fine settings, opened from its channel. */
dialog.menu { background: var(--panel); color: var(--fg); border: 1px solid var(--dim); border-radius: 3px; padding: 16px 18px; width: min(460px, calc(100vw - 32px)); box-sizing: border-box; max-height: calc(100vh - 32px); overflow-y: auto; }
dialog.menu::backdrop { background: rgba(0, 0, 0, 0.55); }
dialog.menu .head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
dialog.menu h3 { font-family: var(--display); font-weight: 400; font-size: 1.1rem; margin: 0; color: var(--gold); }
dialog.menu .maker { border-top: 0; padding-top: 0; }
dialog.menu .maker[hidden] { display: none; }
.seat .take button:hover { border-color: var(--dim); }
.seat.changed .label, .knob.changed .label { color: var(--gold); }
.maker { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.maker h4 { font-family: var(--display); font-weight: 400; font-size: 1rem; margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.maker h4 small { font-family: var(--mono); font-size: 0.75rem; color: var(--dim); }
.maker[data-in="1"] h4 small { color: var(--gold); }
.fold { all: unset; cursor: pointer; display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font: inherit; color: inherit; }
.fold::before { content: "\25BE"; display: inline-block; width: 1em; color: var(--dim); }
.fold[aria-expanded="false"]::before { content: "\25B8"; }
.fold:hover::before { color: var(--fg); }
.fold:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.layer.folded > :not(h3):not(.head), .maker.folded > :not(h4) { display: none; }
.layer.folded .head > .btn { display: none; }
.note { color: var(--dim); max-width: 65ch; margin: 0; line-height: 1.5; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Disclander Sound Lab</h1>
    <nav class="pages" aria-label="Pages">
      <button class="mood" id="tab-music" aria-pressed="true">Music</button>
      <button class="mood" id="tab-sounds" aria-pressed="false">Sounds</button>
    </nav>
    <label class="master" for="vol-master"><span class="label">Master</span><input id="vol-master" type="range" min="0" max="1" step="0.05" value="0.8"></label>
  </header>

  <div class="page" id="page-music">
  <div class="sechead"><h2>Music</h2><label class="vol" for="vol-music"><span class="label">Volume</span><input id="vol-music" type="range" min="0" max="1.5" step="0.05" value="1"></label></div>
  <section aria-label="Tune">
    <div class="moods" id="moods"></div>
  </section>

  <section class="transport" aria-label="Playback">
    <button class="btn play" id="play">Play</button>
    <label class="seed" for="seed">seed <input id="seed" type="number" min="0" max="99999" value="1"></label>
    <button class="mood" id="game" aria-pressed="false">Game listen</button>
    <label class="seed" for="game-speed">day <select id="game-speed"><option value="1">as in the game (24 min)</option><option value="4">4 times as fast (6 min)</option></select></label>
    <span class="status" id="status">pick a tune, press Play</span>
  </section>
  <p class="note" id="game-line" hidden></p>

  <section class="roll" aria-label="Notes of the piece">
    <div class="tracks"><div class="heads" id="heads"></div><canvas id="roll" width="890" height="336"></canvas></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="layers" aria-label="The band">
    <div class="layer" id="band">
      <div class="head"><h3 id="band-title">Band</h3><span><button class="btn small" id="mix-clear">Clear mute and solo</button> <button class="btn small" id="band-built">Back to the built-in band</button></span></div>
      <p class="hint">One channel for each row above, then the effects and the master. Changes come in on the next bar.</p>
      <div class="mixer" id="seats"></div>
    </div>
  </section>

  <section class="layers" id="knobs" aria-label="Knobs"></section>

  <section class="foot">
    <div class="settings">
      <span class="label">Settings to send back</span>
      <textarea id="out" readonly></textarea>
    </div>
    <div style="display:grid;gap:8px">
      <button class="btn" id="copy">Copy settings</button>
      <button class="btn" id="reset">Reset knobs</button>
    </div>
  </section>

  </div>

  <dialog class="menu" id="maker-menu" aria-labelledby="maker-title">
    <div class="head"><h3 id="maker-title"></h3><span><button class="btn small" id="make-built">As built</button> <button class="btn small" id="maker-close">Close</button></span></div>
    <div id="makers"></div>
  </dialog>

  <div class="page" id="page-sounds" hidden>
  <div class="sechead"><h2>Sounds</h2><span class="sub" id="sound-count"></span></div>
  <div class="tabs" id="sound-tabs" role="tablist" aria-label="Kinds of sound"></div>
  <section class="sounds" id="sounds" aria-label="Sounds">
    <p class="note" id="no-sounds">Loading the game's sounds.</p>
  </section>
  </div>
</div>

    [18, "Rim stroke, slap", 0.05, "", "The hiss of the hand on the skin. 0 leaves only the drum's note."],
    [19, "Rim stroke, ring", 0.01, " s", "How long the sharp stroke lasts."],
  ]],
];
// The layers the knobs are laid out in, as music tools usually group them.
const LAYERS = [
  ["writing", "Writing"],
  ["arrangement", "Arrangement"],
  ["sound", "Sound"],
];
// Knob number, label, kind, range or choices (value -1 = the mood's own), the style it belongs to ("": both),
// its layer, and for a range what follows its number ("x" if none).
const KNOBS = [
  [0, "Tempo", "range", [0.5, 1.6, 0.05, 1], "", "writing"],
  [15, "Key", "range", [-6, 6, 1, 0], "", "writing", " semitones"],
  [25, "Second voice when the tune returns", "select", [[-1, "on"], [0, "off"]], "", "arrangement"],
  [1, "Tune's note length", "range", [0.3, 2, 0.05, 1], "", "sound"],
  [17, "Brightness", "range", [0, 2, 0.05, 1], "", "sound"],
  [24, "Tape wobble", "range", [0, 3, 0.05, 1], "", "sound"],
  // (These three are upright sliders in the mixer, beside the channels; a hint each.)
  [27, "Pumping", "range", [0, 2, 0.05, 1], "", "mixer", "x", "Fast tunes dip on each kick."],
  [6, "Echo", "range", [0, 2.5, 0.05, 1], "", "mixer", "x", "Repeats that trail off."],
  [13, "Room", "range", [0, 2.5, 0.05, 1], "", "mixer", "x", "The size of the space."],
];
// The mixer's icons: mute (a speaker struck out), solo (headphones), an instrument's settings (sliders), other notes (a die).
const ICON = {
  mute: `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 6l4 4M14.5 6l-4 4"/></svg>`,
  solo: `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 10V8a5.5 5.5 0 0 1 11 0v2"/><rect x="1.8" y="9.5" width="3" height="4.2" rx="1"/><rect x="11.2" y="9.5" width="3" height="4.2" rx="1"/></svg>`,
  gear: `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/><circle cx="5.5" cy="4" r="1.6" fill="var(--panel)"/><circle cx="10.5" cy="8" r="1.6" fill="var(--panel)"/><circle cx="6.5" cy="12" r="1.6" fill="var(--panel)"/></svg>`,
  dice: `<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2"/><circle cx="5.3" cy="5.3" r="0.6"/><circle cx="10.7" cy="5.3" r="0.6"/><circle cx="8" cy="8" r="0.6"/><circle cx="5.3" cy="10.7" r="0.6"/><circle cx="10.7" cy="10.7" r="0.6"/></svg>`,
};
// A range's number as shown: whole steps bare, shares to two places.
const shown = (k, v) => (k[3][2] >= 1 ? (v > 0 ? "+" : "") + v.toFixed(0) : v.toFixed(2)) + (k[6] ?? "x");
const plain = (k) => (k[2] === "range" ? k[3][3] : k[0] === 11 ? 0 : -1);

const css = getComputedStyle(document.documentElement);
const color = (v) => css.getPropertyValue(v).trim();
let lab, ctx, master, musicGain, groupGains = {}, beds = {};
// The band (one stream, written a bar at a time): the music's own audio clock, the bars sounding or lined up, when the
// first began and how many frames have been lined up since, and the tune picked.
let mx = null, bars = [], t0 = 0, frames = 0, pumpTimer = null, legendKey = "";
let mood = 1, playing = false, timer = null;
// How much music is kept lined up ahead: three bars, and no less than this many seconds. A change takes back what has
// not begun, so it is never more than the bridge and a bit away.
const AHEAD = 2.5, BARS_AHEAD = 3;
const values = Object.fromEntries(KNOBS.map((k) => [k[0], plain(k)]));
// Who sits where: seated[tune][seat] = the instrument's number (-1 nobody), how loud, and what the
// game has there. And the instruments' fine settings, by number: the value, as built, and its range.
let seated = [], makes = [];

function audio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.connect(ctx.destination);
  for (const g of SECTIONS) { groupGains[g] = ctx.createGain(); groupGains[g].connect(master); }
  // The music has a clock of its own at the composer's rate, so that bars join sample for sample.
  try { mx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: lab.rate() }); } catch { mx = ctx; }
  musicGain = mx.createGain(); musicGain.connect(mx === ctx ? master : mx.destination);
  const set = (node, id) => { const el = document.getElementById(id); if (!el) return; const f = () => (node.gain.value = Number(el.value)); el.addEventListener("input", f); f(); };
  set(master, "vol-master");
  const vol = () => { const v = (id) => Number(document.getElementById(id).value); musicGain.gain.value = v("vol-music") * (mx === ctx ? 1 : v("vol-master")); };
  for (const id of ["vol-master", "vol-music"]) document.getElementById(id).addEventListener("input", vol);
  vol();
  for (const g of SECTIONS) set(groupGains[g], "vol-" + g);
}

// The game's sounds, from the manifest the sounds side writes (assets/sounds/catalog.json).
const SECTIONS = ["Interface", "Effects", "Ambience"];
const decoded = {};
async function soundBuffer(file) {
  if (!decoded[file]) decoded[file] = fetch("sounds/" + file).then((r) => { if (!r.ok) throw new Error(file); return r.arrayBuffer(); }).then((b) => ctx.decodeAudioData(b));
  return decoded[file];
}

async function loadSounds() {
  const box = document.getElementById("sounds");
  let list;
  try { list = (await (await fetch("sounds/catalog.json")).json()).sounds; }
  catch { document.getElementById("no-sounds").textContent = "No sounds here yet. They load when the page sits beside the game's sound files."; return; }
  box.innerHTML = "";
  document.getElementById("sound-count").textContent = `${list.length} sounds`;
  const tabs = document.getElementById("sound-tabs"); tabs.innerHTML = "";
  // One kind of sound shows at a time; what is playing plays on.
  const pick = (section) => {
    for (const s of SECTIONS) {
      document.getElementById("group-" + s).hidden = s !== section;
      document.getElementById("soundtab-" + s).setAttribute("aria-pressed", s === section);
    }
  };
  for (const section of SECTIONS) {
    const items = list.filter((s) => s.section === section);
    const t = document.createElement("button"); t.className = "mood"; t.id = "soundtab-" + section;
    t.textContent = `${section} (${items.length})`; t.onclick = () => pick(section);
    tabs.append(t);
    const g = document.createElement("div"); g.className = "group"; g.id = "group-" + section;
    g.innerHTML = `<div class="head"><h3>${section}</h3><label class="vol" for="vol-${section}"><span class="label">Vol</span><input id="vol-${section}" type="range" min="0" max="1.5" step="0.05" value="1"></label><button class="btn small" id="stop-${section}">Stop</button></div><div class="list"></div>`;
    const ul = g.querySelector(".list");
    items.forEach((s, i) => {
      const b = document.createElement("button"); b.className = "snd"; b.id = `snd-${section}-${i}`;
      b.setAttribute("aria-pressed", "false");
      b.innerHTML = `<span class="n"></span><span class="tag">${s.loop ? "loop" : ""}</span><span class="a"></span>`;
      // Takes of one sound share their line: show it on the first only.
      const about = i > 0 && items[i - 1].about === s.about ? "" : s.about || "";
      b.querySelector(".n").textContent = s.name; b.querySelector(".a").textContent = about;
      if (!about) b.querySelector(".a").remove();
      b.onclick = () => playSound(s, b);
      ul.append(b);
    });
    if (!items.length) ul.innerHTML = `<p class="note">None yet.</p>`;
    box.append(g);
    g.querySelector("#stop-" + section).onclick = () => stopSection(section);
  }
  pick(SECTIONS[0]);
}

// The two pages: the music, and the sounds (at #sounds).
function showPage(redraw) {
  const sounds = location.hash === "#sounds";
  document.getElementById("page-music").hidden = sounds;
  document.getElementById("page-sounds").hidden = !sounds;
  document.getElementById("tab-music").setAttribute("aria-pressed", !sounds);
  document.getElementById("tab-sounds").setAttribute("aria-pressed", sounds);
  if (!sounds && redraw) draw();
}
document.getElementById("tab-music").onclick = () => { history.replaceState(null, "", location.pathname + location.search); showPage(true); };
document.getElementById("tab-sounds").onclick = () => { location.hash = "#sounds"; };
window.addEventListener("hashchange", () => showPage(true));
showPage(false);

const oneShots = { Interface: new Set(), Effects: new Set(), Ambience: new Set() };
async function playSound(s, b) {
  audio(); if (ctx.state === "suspended") ctx.resume();
  const key = s.section + "/" + s.name;
  if (s.loop && beds[key]) { beds[key].stop(); return; }
  let buf;
  try { buf = await soundBuffer(s.file); } catch { flash(`could not load ${s.file}`); return; }
  const src = ctx.createBufferSource(); src.buffer = buf; src.playbackRate.value = s.pitch || 1; src.loop = !!s.loop;
  src.connect(groupGains[s.section] || master);
  src.start();
  if (s.loop) {
    b.setAttribute("aria-pressed", "true");
    beds[key] = { stop() { try { src.stop(); } catch {} b.setAttribute("aria-pressed", "false"); delete beds[key]; } };
  } else {
    oneShots[s.section].add(src); src.onended = () => oneShots[s.section].delete(src);
  }
}

function stopSection(section) {
  for (const k of Object.keys(beds)) if (k.startsWith(section + "/")) beds[k].stop();
  for (const src of oneShots[section]) { try { src.stop(); } catch {} }
  oneShots[section].clear();
}

function bytes(b64) { const s = atob(b64); const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }

async function boot() {
  const { instance } = await WebAssembly.instantiate(bytes(WASM), {});
  lab = instance.exports;
  hire();
  buildUi();
  await loadSounds();
  audio();
  writeSettings();
  draw();
}

function buildUi() {
  const row = document.getElementById("moods");
  MOODS.forEach((name, i) => {
    const b = document.createElement("button");
    b.className = "mood"; b.textContent = name; b.id = "mood-" + i;
    b.setAttribute("aria-pressed", i === mood);
    b.onclick = () => { gameOff(); pickMood(i); };
    row.append(b);
  });
  const layers = document.getElementById("knobs");
  const boxes = {};
  for (const [key, title] of LAYERS) {
    const l = document.createElement("div"); l.className = "layer";
    l.innerHTML = (title ? `<h3>${title}</h3>` : "") + `<div class="knobs"></div>`;
    layers.append(l); boxes[key] = l.querySelector(".knobs");
  }
  for (const knob of KNOBS) {
    if (knob[5] === "mixer") continue;
    const box = boxes[knob[5]];
    const [n, label, kind, spec, only] = knob;
    const k = document.createElement("div"); k.className = "knob";
    if (only) k.dataset.only = only;
    const id = "knob-" + n + (only ? "-" + only : "");
    if (kind === "range") {
      k.innerHTML = `<div class="top"><label class="label" for="${id}">${label}</label><output id="${id}-out"></output></div><input id="${id}" type="range" min="${spec[0]}" max="${spec[1]}" step="${spec[2]}" value="${spec[3]}">`;
    } else {
      k.innerHTML = `<label class="label" for="${id}">${label}</label><select id="${id}">${spec.map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>`;
    }
    box.append(k);
    const input = k.querySelector("#" + id);
    const show = () => { const o = k.querySelector("output"); if (o) o.textContent = shown(knob, Number(input.value)); };
    show();
    input.addEventListener("input", () => { values[n] = Number(input.value); show(); });
    input.addEventListener("change", () => {
      values[n] = Number(input.value);
      steer();
    });
  }
  buildBand();
  foldable();
  // Volume sliders made before the sounds load are hooked up when audio starts.
  document.getElementById("play").onclick = () => { if (playing) { gameOff(); stop(); } else start(); };
  document.getElementById("game").onclick = () => (game.on ? gameOff() : gameOn());
  document.getElementById("seed").addEventListener("change", () => { gameOff(); writeSettings(); if (playing) { stop(); start(); } });
  document.getElementById("reset").onclick = () => {
    // Every knob back to the mood's own.
    for (const k of KNOBS) { values[k[0]] = plain(k); const el = document.getElementById("knob-" + k[0] + (k[4] ? "-" + k[4] : "")); el.value = values[k[0]]; el.dispatchEvent(new Event("input")); }
    steer();
  };
  document.getElementById("copy").onclick = async () => {
    const t = document.getElementById("out");
    try { await navigator.clipboard.writeText(t.value); flash("copied"); } catch { t.select(); flash("selected: copy it with Ctrl+C"); }
  };
  window.addEventListener("resize", draw);
}


// Every panel, and every instrument inside "Inside the instruments", folds away from its heading; the page remembers
// which are folded (in this browser only).
function foldable() {
  let folded = [];
  try { folded = JSON.parse(localStorage.getItem("lab-folded") || "[]"); } catch {}
  const keep = () => { try { localStorage.setItem("lab-folded", JSON.stringify(folded)); } catch {} };
  document.querySelectorAll("#page-music .layer, #page-music .maker").forEach((box, i) => {
    const h = box.querySelector("h3, h4");
    if (!h) return;
    // The heading's words go inside a button; a heading that is rewritten (the band's) keeps its id on them.
    const key = h.id || h.firstChild.textContent.trim() || "panel-" + i;
    const b = document.createElement("button"); b.className = "fold"; b.type = "button";
    const words = document.createElement("span");
    while (h.firstChild) words.append(h.firstChild);
    if (h.id) { words.id = h.id; h.removeAttribute("id"); }
    b.append(words); h.append(b);
    const set = (shut) => { box.classList.toggle("folded", shut); b.setAttribute("aria-expanded", !shut); };
    set(folded.includes(key));
    b.onclick = () => {
      const shut = !box.classList.contains("folded");
      set(shut);
      folded = folded.filter((k) => k !== key); if (shut) folded.push(key);
      keep();
    };
  });
}

// What sits in a seat, in words.
const seatName = (s, kind) => (kind < 0 ? "nobody" : s === 4 ? DRUM_KINDS[kind] : VOICES[kind][0]);
const fine = (m, v) => (m[2] >= 1 ? v.toFixed(0) : m[2] >= 0.1 ? v.toFixed(1) : m[2] >= 0.01 ? v.toFixed(2) : v.toFixed(3)) + m[3];

// The band panel and the instruments' fine settings, read from the composer: what it has built is the start.
function buildBand() {
  seated = MOODS.map((_, m) => SEATS.map((_, s) => { const k = lab.seat_built(m, s); return { kind: k, loud: 1, built: k, take: 0 }; }));
  for (let i = 0; !Number.isNaN(lab.make_spec(i, 0)); i++) {
    const [lo, hi, built] = [0, 1, 2].map((w) => Number(lab.make_spec(i, w).toFixed(4)));
    makes.push({ lo, hi, built, v: built });
  }
  const box = document.getElementById("seats");
  SEATS.forEach(([name, about], s) => {
    const choices = [];
    for (let i = 0; lab.seat_choice(s, i) >= 0; i++) choices.push(lab.seat_choice(s, i));
    const d = document.createElement("div"); d.className = "seat"; d.id = "seatbox-" + s;
    // Its row beside the notes: its name and who sits in it.
    const head = document.createElement("div"); head.className = "head"; head.id = "head-" + s;
    head.innerHTML = `<label class="label" for="seat-${s}">${name}</label>`
      + `<select id="seat-${s}" title="${about}"><option value="-1">nobody</option>${choices.map((k) => `<option value="${k}">${seatName(s, k)}</option>`).join("")}</select>`;
    document.getElementById("heads").append(head);
    d.innerHTML = `<div class="top"><span class="label">${name}</span></div><div class="who" id="seat-${s}-who"></div>`
      + `<div class="ms"><button class="mute" id="seat-${s}-mute" aria-pressed="false" aria-label="Mute ${name}" title="Mute: silence this channel">${ICON.mute}</button>`
      + `<button class="solo" id="seat-${s}-solo" aria-pressed="false" aria-label="Solo ${name}" title="Solo: silence all the others">${ICON.solo}</button>`
      + `<button class="gear" id="seat-${s}-gear" aria-label="Settings of the ${name} instrument">${ICON.gear}</button></div>`
      + `<input id="seat-${s}-loud" type="range" min="0.1" max="2" step="0.05" value="1" aria-label="${name} loudness">`
      + `<output id="seat-${s}-out"></output>`
      + (TAKES.includes(s) ? `<div class="take"><label for="seat-${s}-take">notes</label><input id="seat-${s}-take" type="number" min="0" max="9999" step="1" value="0" title="A number that writes this channel's notes afresh; 0 is the tune as built">`
        + `<button id="seat-${s}-roll" aria-label="Other notes for ${name}" title="Pick another number">${ICON.dice}</button></div>` : `<div class="take"></div>`)
      + `<p class="hint">${about}</p>`;
    box.append(d);
    const pick = head.querySelector("select"), loud = d.querySelector("input[type=range]");
    const here = () => seated[mood][s];
    if (TAKES.includes(s)) {
      const take = d.querySelector(".take input");
      take.addEventListener("change", () => { here().take = Math.max(0, Math.min(9999, Math.round(Number(take.value)) || 0)); showBand(); steer(); });
      d.querySelector(".take button").onclick = () => { here().take = 1 + Math.floor(Math.random() * 9999); showBand(); steer(); };
    }
    d.querySelector(".gear").onclick = () => openMaker(makerOf(s));
    d.querySelector(".mute").onclick = () => { mix.mute[s] = !mix.mute[s]; showBand(); steer(); };
    d.querySelector(".solo").onclick = () => { mix.solo[s] = !mix.solo[s]; showBand(); steer(); };
    pick.addEventListener("change", () => { here().kind = Number(pick.value); showBand(); steer(); });
    loud.addEventListener("input", () => { here().loud = Number(loud.value); showBand(); });
    loud.addEventListener("change", () => { here().loud = Number(loud.value); steer(); });
  });
  // The effects everything passes through, three upright sliders in one strip: pumping, echo, room.
  const fx = document.createElement("div"); fx.className = "seat fx";
  fx.innerHTML = `<div class="top"><span class="label">Effects</span></div><div class="who">everything</div><div class="ms"></div><div class="trio"></div><div class="take"></div><p class="hint">What all the channels pass through.</p>`;
  box.append(fx);
  for (const knob of KNOBS.filter((k) => k[5] === "mixer")) {
    const [n, label, , spec] = knob, id = "knob-" + n;
    const d = document.createElement("div"); d.className = "col";
    d.innerHTML = `<input id="${id}" type="range" min="${spec[0]}" max="${spec[1]}" step="${spec[2]}" value="${spec[3]}" title="${knob[7]}"><output id="${id}-out"></output><label class="label" for="${id}" title="${knob[7]}">${label}</label>`;
    fx.querySelector(".trio").append(d);
    const input = d.querySelector("input"), show = () => { d.querySelector("output").textContent = Number(input.value).toFixed(2); d.classList.toggle("changed", Number(input.value) !== spec[3]); };
    show();
    input.addEventListener("input", () => { values[n] = Number(input.value); show(); });
    input.addEventListener("change", () => { values[n] = Number(input.value); steer(); });
  }
  // The master: the music's own volume, as a channel.
  const m = document.createElement("div"); m.className = "seat master";
  m.innerHTML = `<div class="top"><label class="label" for="mix-master">Master</label></div><div class="who">everything</div><div class="ms"></div>`
    + `<input id="mix-master" type="range" min="0" max="1.5" step="0.05" value="1" aria-label="Master loudness"><output id="mix-master-out">1.00x</output>`
    + `<div class="take"></div><p class="hint">All the channels together.</p>`;
  box.append(m);
  const master = m.querySelector("input"), music = document.getElementById("vol-music");
  const both = (from, to) => { to.value = from.value; document.getElementById("mix-master-out").textContent = Number(from.value).toFixed(2) + "x"; };
  master.addEventListener("input", () => { both(master, music); music.dispatchEvent(new Event("input")); });
  music.addEventListener("input", () => both(music, master));
  document.getElementById("mix-clear").onclick = () => { mix.mute.fill(false); mix.solo.fill(false); showBand(); steer(); };
  document.getElementById("band-built").onclick = () => {
    for (const x of seated[mood]) { x.kind = x.built; x.loud = 1; x.take = 0; }
    showBand(); steer();
  };
  const layer = document.getElementById("makers");
  for (const [name, , list] of MAKERS) {
    const g = document.createElement("div"); g.className = "maker";
    g.innerHTML = `<div class="knobs"></div>`;
    layer.append(g);
    for (const m of list) {
      const x = makes[m[0]], id = "make-" + m[0];
      const k = document.createElement("div"); k.className = "knob"; k.id = id + "-box";
      k.innerHTML = `<div class="top"><label class="label" for="${id}">${m[1]}</label><output id="${id}-out"></output></div>`
        + `<input id="${id}" type="range" min="${x.lo}" max="${x.hi}" step="${m[2]}" value="${x.built}"><p class="hint">${m[4]}</p>`;
      g.querySelector(".knobs").append(k);
      const input = k.querySelector("input");
      input.addEventListener("input", () => { x.v = Number(input.value); showBand(); });
      input.addEventListener("change", () => { x.v = Number(input.value); steer(); });
    }
  }
  const menu = document.getElementById("maker-menu");
  document.getElementById("make-built").onclick = () => { for (const m of MAKERS[opened][2]) makes[m[0]].v = makes[m[0]].built; showBand(); steer(); };
  document.getElementById("maker-close").onclick = () => menu.close();
  menu.addEventListener("click", (e) => { if (e.target === menu) menu.close(); });
  showBand();
}

// The instrument with fine settings that sits in seat `s` of the tune picked: its place in MAKERS, or -1.
const makerOf = (s) => { const k = seated[mood][s].kind; return MAKERS.findIndex(([, who]) => (s === 4 ? who === "d" + k : who === k)); };
// Opens an instrument's fine settings, from its channel.
let opened = 0;
function openMaker(i) {
  if (i < 0) return;
  opened = i;
  document.getElementById("maker-title").textContent = MAKERS[i][0];
  document.querySelectorAll("#makers .maker").forEach((g, j) => { g.hidden = j !== i; });
  document.getElementById("maker-menu").showModal();
}

// Shows the band of the tune picked, and which of the instruments with fine settings are in it.
function showBand() {
  const seats = seated[mood];
  document.getElementById("band-title").textContent = `Band: ${MOODS[mood]}`;
  seats.forEach((x, s) => {
    const pick = document.getElementById("seat-" + s), loud = document.getElementById(`seat-${s}-loud`);
    pick.value = x.kind; loud.value = x.loud; loud.disabled = x.kind < 0;
    document.getElementById(`seat-${s}-out`).textContent = x.kind < 0 ? "" : x.loud.toFixed(2) + "x";
    document.getElementById(`seat-${s}-mute`).setAttribute("aria-pressed", mix.mute[s]);
    document.getElementById(`seat-${s}-solo`).setAttribute("aria-pressed", mix.solo[s]);
    document.getElementById("seatbox-" + s).classList.toggle("silent", silenced(s));
    document.getElementById(`seat-${s}-who`).textContent = seatName(s, x.kind);
    document.getElementById("head-" + s).classList.toggle("silent", silenced(s));
    document.getElementById("head-" + s).classList.toggle("changed", x.kind !== x.built);
    if (TAKES.includes(s)) document.getElementById(`seat-${s}-take`).value = x.take;
    const gear = document.getElementById(`seat-${s}-gear`), mk = makerOf(s);
    gear.disabled = mk < 0;
    gear.title = mk < 0 ? (x.kind < 0 ? "Nobody sits here" : "This instrument has no fine settings yet") : `${MAKERS[mk][0]}: how the instrument is built`;
    gear.classList.toggle("changed", mk >= 0 && MAKERS[mk][2].some((m) => makes[m[0]].v !== makes[m[0]].built));
    document.getElementById("seatbox-" + s).classList.toggle("changed", x.kind !== x.built || (x.kind >= 0 && x.loud !== 1) || x.take !== 0);
  });
  MAKERS.forEach(([, , list]) => {
    for (const m of list) {
      const x = makes[m[0]];
      document.getElementById("make-" + m[0]).value = x.v;
      document.getElementById(`make-${m[0]}-out`).textContent = fine(m, x.v);
      document.getElementById(`make-${m[0]}-box`).classList.toggle("changed", x.v !== x.built);
    }
  });
}

// The seats and fine settings that are not as built, for the band's worker and for the settings text.
// The mixer's mute and solo, a channel a seat, the same for every tune: a channel is silent when it is muted, or
// when another is soloed and it is not.
// The seats whose notes a number of their own writes (the second voice sings the tune's and the pad holds the chords').
const TAKES = [0, 2, 3, 4];
const mix = { mute: SEATS.map(() => false), solo: SEATS.map(() => false) };
const silenced = (s) => mix.mute[s] || (mix.solo.some(Boolean) && !mix.solo[s]);

// The bands as they are set, for the settings text; `heard`, as they are to sound, with mute and solo.
function bandNow(heard = false) {
  const seats = [];
  seated.forEach((list, m) => list.forEach((x, s) => {
    const off = heard && silenced(s) && x.kind >= 0;
    if (off) seats.push([m, s, x.kind, 0]);
    else if (x.kind !== x.built || (x.kind >= 0 && x.loud !== 1)) seats.push([m, s, x.kind, x.loud]);
  }));
  const takes = [];
  seated.forEach((list, m) => list.forEach((x, s) => { if (x.take) takes.push([m, s, x.take]); }));
  return { seats, takes, makes: makes.map((x, i) => [i, x.v]).filter(([i, v]) => v !== makes[i].built) };
}

function flash(msg) { document.getElementById("status").textContent = msg; setTimeout(status, 1500); }

function writeSettings() {
  const seed = Number(document.getElementById("seed").value) || 0;
  const changed = KNOBS.filter((k) => values[k[0]] !== plain(k))
    .map((k) => k[2] === "range" ? `${k[1]}: ${shown(k, values[k[0]])}` : `${k[1]}: ${k[3].find(([v]) => v === values[k[0]])[1]}`);
  // The bands that are not as built, a line a tune, and the instruments' fine settings.
  const now = bandNow(), lines = {};
  for (const [m, s, kind, loud] of now.seats) {
    const key = `Band, ${MOODS[m]}`;
    (lines[key] ??= []).push(`${SEATS[s][0]} ${seatName(s, kind)}${kind >= 0 && loud !== 1 ? " " + loud.toFixed(2) + "x" : ""}`);
  }
  for (const [m, s, take] of now.takes) (lines[`Band, ${MOODS[m]}`] ??= []).push(`${SEATS[s][0]} notes ${take}`);
  const band = Object.entries(lines).map(([k, v]) => `${k}: ${v.join(", ")}`);
  for (const [name, , list] of MAKERS) {
    const set = list.filter((m) => now.makes.some(([i]) => i === m[0])).map((m) => `${m[1]} ${fine(m, makes[m[0]].v)}`);
    if (set.length) band.push(`${name}: ${set.join(", ")}`);
  }
  document.getElementById("out").value = `Music lab, ${MOODS[mood]}, seed ${seed}\n` + (changed.length ? changed.join("\n") : "(all knobs at the tune's own)")
    + (band.length ? "\n" + band.join("\n") : "");
}


// The band lives in a worker of its own (a second copy of the composer), so that writing a bar, a twentieth of a
// second's work or more, never holds up the picture or the page. It is asked for one bar at a time and answers with
// the bar's sound and notes; `gen` counts the starts and steerings, so that a bar asked for before one is known to be
// stale when it comes back, and `asked` says a bar is being written.
const WRITER = `
let lab, ready;
onmessage = async (e) => {
  const m = e.data;
  if (m.cmd === "boot") { ready = WebAssembly.instantiate(m.wasm, {}).then((w) => { lab = w.instance.exports; }); return; }
  await ready;
  if (m.knobs) for (const [n, v] of m.knobs) lab.tune(n, v);
  if (m.band) {
    lab.band_built();
    for (const a of m.band.seats) lab.band_seat(a[0], a[1], a[2], a[3]);
    for (const a of m.band.takes) lab.band_take(a[0], a[1], a[2]);
    for (const [i, v] of m.band.makes) lab.band_make(i, v);
  }
  if (m.cmd === "start") lab.band_start(m.mood, m.seed);
  else if (m.cmd === "steer") { if (m.back) lab.band_back(m.back); lab.band_steer(m.mood); }
  else if (m.cmd === "bar") {
    const len = lab.band_bar();
    const both = new Float32Array(lab.memory.buffer, lab.samples(), len * 2);
    const l = new Float32Array(len), r = new Float32Array(len);
    for (let i = 0; i < len; i++) { l[i] = both[2 * i]; r[i] = both[2 * i + 1]; }
    const count = lab.note_count();
    const notes = new Float32Array(lab.memory.buffer, lab.notes(), count * 5).slice();
    const seats = Array.from({ length: count }, (_, i) => lab.band_note_seat(i));
    const info = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => lab.band_info(i));
    postMessage({ gen: m.gen, len, l, r, notes, seats, info }, [l.buffer, r.buffer, notes.buffer]);
  }
};`;
let writer = null, gen = 0, asked = false;
const knobsNow = () => KNOBS.map((k) => [k[0], values[k[0]]]);

function hire() {
  writer = new Worker(URL.createObjectURL(new Blob([WRITER], { type: "text/javascript" })));
  writer.postMessage({ cmd: "boot", wasm: bytes(WASM) });
  writer.onmessage = (e) => { asked = false; if (playing && e.data.gen === gen) lineUp(e.data); pump(); };
}

// Asks the band for a bar while not enough music is lined up.
function pump() {
  if (!playing || asked) return;
  const rate = lab.rate(), now = mx.currentTime;
  // The next bar is asked for when the one sounding is half over.
  const on = bars.find((b) => b.at <= now && now < b.at + b.secs);
  const mark = now + (on ? on.secs / 2 : 0);
  if (t0 + frames / rate < now + AHEAD || bars.filter((b) => b.at > mark).length < BARS_AHEAD) {
    asked = true;
    writer.postMessage({ cmd: "bar", gen });
  }
  bars = bars.filter((b) => b.at + b.secs > now - 12);
}

// Lines a written bar up to begin on the frame the one before it ends.
function lineUp(m) {
  const rate = lab.rate(), len = m.len;
  if (!len) return;
  const buf = mx.createBuffer(2, len, rate);
  buf.copyToChannel(m.l, 0); buf.copyToChannel(m.r, 1);
  const ns = [];
  for (let i = 0; i * 5 < m.notes.length; i++) ns.push(m.notes.subarray(i * 5, i * 5 + 5));
  // Fallen behind (a sleeping tab, or the very first bar): pick up from now.
  if (t0 + frames / rate < mx.currentTime + 0.02) { t0 = mx.currentTime + 0.06; frames = 0; }
  const src = mx.createBufferSource(); src.buffer = buf; src.connect(musicGain);
  const at = t0 + frames / rate;
  src.start(at);
  const f = m.info;
  bars.push({ at, frame: frames, secs: len / rate, notes: ns, seats: m.seats, tune: f[0], part: f[1], bpm: f[2], to: f[4], step: f[5], lead: f[6], on: f[7], src });
  frames += len;
}

// A new tune or knob: the bars lined up but not yet begun are taken back and written again (with a bar that
// is being written just now). The band makes the first three of them a bridge to the new tune (still the
// old band, leading in), which comes in on the bar after; a knob comes in on the first.
// Picks a tune, as its button does.
function pickMood(i) {
  mood = i;
  MOODS.forEach((_, j) => document.getElementById("mood-" + j).setAttribute("aria-pressed", j === mood));
  steer();
}

// Game listen (sinan 2026-11-14: "can you add a game listen mode"): the lab plays as a session of the game would
// sound. A seed nobody chose; the hour's tune as the day goes round (an hour is a minute, as in the game: dawn and
// dusk the hour either side of sunrise at 6 and sunset at 18); and now and then something happens (a chase, a battle,
// a raid, a siege) and its fast tune drops in, stays while it lasts, and gives way to the hour's tune again. Picking
// a tune by hand or pressing Stop leaves the mode.
const game = { on: false, timer: null, clock: 0, last: 0, event: null, next: 0 };
// What can happen: its tune, how likely, and how long it lasts, s.
const EVENTS = [
  { name: "a chase", tune: 5, weight: 4, secs: [35, 75] },
  { name: "a battle", tune: 6, weight: 3, secs: [50, 110] },
  { name: "a raid", tune: 8, weight: 2, secs: [40, 80] },
  { name: "a siege", tune: 7, weight: 1, secs: [90, 160] },
];
const between = ([a, b]) => a + Math.random() * (b - a);
const hourTune = (h) => (Math.abs(h - 6) < 1 ? 0 : Math.abs(h - 18) < 1 ? 2 : h > 6 && h < 18 ? 1 : 3);

function gameOn() {
  game.on = true; game.clock = 5.5 * 60; game.last = performance.now(); game.event = null;
  game.next = performance.now() + 1000 * between([40, 80]);
  document.getElementById("seed").value = Math.floor(Math.random() * 100000);
  document.getElementById("game").setAttribute("aria-pressed", "true");
  document.getElementById("game-line").hidden = false;
  mood = hourTune(5.5);
  MOODS.forEach((_, j) => document.getElementById("mood-" + j).setAttribute("aria-pressed", j === mood));
  if (seated.length) showBand();
  writeSettings();
  if (playing) stop();
  start();
  game.timer = setInterval(gameTick, 500);
  gameTick();
}

function gameOff() {
  if (!game.on) return;
  game.on = false; clearInterval(game.timer);
  document.getElementById("game").setAttribute("aria-pressed", "false");
  document.getElementById("game-line").hidden = true;
}

function gameTick() {
  const now = performance.now(), f = (n) => String(Math.floor(n)).padStart(2, "0");
  // The game's clock, s: an hour is a minute.
  game.clock += (now - game.last) / 1000 * Number(document.getElementById("game-speed").value);
  game.last = now;
  const hour = (game.clock / 60) % 24, day = 1 + Math.floor(game.clock / 60 / 24);
  if (game.event && now >= game.event.until) {
    game.event = null;
    game.next = now + 1000 * between([60, 150]);
  } else if (!game.event && now >= game.next) {
    let pick = Math.random() * EVENTS.reduce((a, e) => a + e.weight, 0);
    const e = EVENTS.find((e) => (pick -= e.weight) < 0) ?? EVENTS[0];
    game.event = { ...e, until: now + 1000 * between(e.secs) };
  }
  const want = game.event ? game.event.tune : hourTune(hour);
  if (want !== mood) pickMood(want);
  const left = (t) => { const s = Math.max(0, (t - now) / 1000); return `${Math.floor(s / 60)}:${f(s % 60)}`; };
  document.getElementById("game-line").textContent =
    `Game listen · day ${day}, ${f(hour)}:${f((hour % 1) * 60)} · ` +
    (game.event ? `${game.event.name}: ${MOODS[game.event.tune]} for another ${left(game.event.until)}`
      : `quiet: ${MOODS[hourTune(hour)]}, something happens in ${left(game.next)}`);
}

function steer() {
  if (seated.length) showBand();
  writeSettings();
  if (!playing) return;
  const soon = mx.currentTime + 0.3;
  const ahead = bars.filter((b) => b.at > soon);
  for (const b of ahead) { try { b.src.stop(); } catch {} }
  if (ahead.length) { bars = bars.filter((b) => !ahead.includes(b)); frames = ahead[0].frame; }
  writer.postMessage({ cmd: "steer", back: ahead.length + (asked ? 1 : 0), mood, knobs: knobsNow(), band: bandNow(true) });
  gen++;
  pump();
}

function start() {
  if (ctx.state === "suspended") ctx.resume();
  if (mx.state === "suspended") mx.resume();
  writer.postMessage({ cmd: "start", mood, seed: Number(document.getElementById("seed").value) || 0, knobs: knobsNow(), band: bandNow(true) });
  gen++;
  for (const b of bars) { try { b.src.stop(); } catch {} }
  bars = []; t0 = mx.currentTime + 0.1; frames = 0; playing = true;
  document.getElementById("play").textContent = "Stop";
  pump();
  pumpTimer = setInterval(pump, 150);
  tick();
}

function stop() {
  clearInterval(pumpTimer);
  for (const b of bars) { try { b.src.stop(); } catch {} }
  bars = []; playing = false; gen++;
  document.getElementById("play").textContent = "Play";
  cancelAnimationFrame(timer); draw(); status();
}

// The bar sounding now.
const sounding = () => { const now = mx.currentTime; return bars.find((b) => b.at <= now && now < b.at + b.secs); };

function status() {
  const f = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  const b = playing && sounding();
  document.getElementById("status").textContent = b
    ? `${MOODS[b.tune]}${b.to < 0 ? "" : ` · bridge to ${MOODS[b.to]}, bar ${b.step} of 3`}${[" · the drop", " · the drop, bass still to come", " · the bass lands"][b.lead - 4] ?? (b.lead > 0 ? " · lead-in to a drop" : "")}${b.lead === 0 && b.on > 0 ? ` · ${["", "the charge", "half speed", "the stops"][b.on]}` : ""} · ${Math.round(b.bpm)} beats a minute · ${f(mx.currentTime - t0)}`
    : playing ? "starting" : "pick a tune, press Play";
}

function tick() { draw(); status(); if (playing) timer = requestAnimationFrame(tick); }

// The voices sounding in the bars shown.
function legend(used) {
  const key = [...used].sort().join();
  if (key === legendKey) return;
  legendKey = key;
  const box = document.getElementById("legend"); box.innerHTML = "";
  VOICES.forEach(([name, v], i) => { if (!used.has(i)) return; const s = document.createElement("span"); s.innerHTML = `<i style="background:${color(v)}"></i>${name}`; box.append(s); });
}

function draw() {
  const c = document.getElementById("roll");
  const w = c.clientWidth, h = c.clientHeight, dpr = window.devicePixelRatio || 1;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "#0c0c14"; g.fillRect(0, 0, w, h);
  if (!playing) { legend(new Set()); return; }
  // Fourteen seconds: half gone by, half lined up ahead. The upright lines are the bars. A row a channel, as the
  // names at the left have them: in a row, higher is a higher note (each row over its own stretch of pitch); in the
  // drums' row a line a drum, the kick lowest and the hats on top.
  const span = 14, now = mx.currentTime, from = now - span * 0.5;
  const x = (t) => ((t - from) / span) * w;
  const row = h / SEATS.length;
  const RANGE = [[190, 1600], [190, 1600], [90, 1300], [38, 220], [0, 0], [60, 1100]];
  const DRUM_ROW = { 19: 0, 5: 0, 14: 0, 26: 1, 20: 2, 27: 2, 21: 3, 4: 3 };
  const y = (s, hz, v) => {
    const top = s * row + 5, bottom = (s + 1) * row - 5;
    if (s === 4) return bottom - ((DRUM_ROW[v] ?? 1) / 3) * (bottom - top);
    const [lo, hi] = RANGE[s].map(Math.log2);
    return bottom - Math.min(1, Math.max(0, (Math.log2(hz) - lo) / (hi - lo))) * (bottom - top);
  };
  g.strokeStyle = "#1d1d2c"; g.lineWidth = 1;
  for (let s = 1; s < SEATS.length; s++) { g.beginPath(); g.moveTo(0, s * row + 0.5); g.lineTo(w, s * row + 0.5); g.stroke(); }
  const used = new Set();
  for (const b of bars) {
    if (b.at + b.secs + 6 < from || b.at > from + span) continue;
    g.fillStyle = "#2a2a3e"; g.fillRect(x(b.at), 0, 1, h);
    b.notes.forEach((n, i) => {
      const [at, v, hz, len, loud] = n;
      const t = b.at + at, s = b.seats[i];
      if (t + len < from || t > from + span || loud <= 0 || s < 0) return;
      used.add(v);
      g.globalAlpha = Math.min(1, 0.35 + loud * 1.6);
      g.fillStyle = color(VOICES[v][1]);
      const wide = s === 4 ? Math.max(2, Math.min(6, x(t + len) - x(t))) : Math.max(2, x(t + len) - x(t) - 1);
      g.fillRect(x(t), y(s, hz, v) - 2, wide, 4);
    });
    g.globalAlpha = 1;
  }
  legend(used);
  g.fillStyle = color("--gold"); g.fillRect(x(now), 0, 2, h);
}

boot().catch((e) => { document.getElementById("status").textContent = "The composer did not load: " + e.message; });
</script>

</body>
